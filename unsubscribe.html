<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe | White Horse Clips</title>
<link rel="icon" href="favicon.ico">
<style>
  body{ margin:0; background:#000; color:#f5f5f5; font-family:Arial,Helvetica,sans-serif; }
  main{ max-width:32rem; margin:14vh auto; padding:0 1.5rem; }
  h1{ font-size:1.6rem; margin:0 0 .8rem; }
  p{ line-height:1.6; color:#bbb; }
  a{ color:#818cf8; }
</style>
</head>
<body>
<main>
  <h1>One moment&hellip;</h1>
  <p>We are processing your request. If nothing happens, email <a href="mailto:info@whclips.co.za">info@whclips.co.za</a> and we will remove you by hand.</p>
</main>
<script>
  // The unsubscribe link in our emails points here, on our own domain. Masked form (21 Oct 2026): ?u=<anonymous code>&s=<signature>, no address in the link or on this page.
  // The older ?e=&s= form (reminder emails already sent) still goes to the Worker as before.
  (function(){
    var q = location.search, h = document.querySelector('h1'), p = document.querySelector('p');
    function say(t, b){ h.textContent = t; p.textContent = b; }
    if (/[?&]u=/.test(q) && /[&?]s=/.test(q)) {
      fetch('https://whclips-access-gate.green-mouse-5a6e.workers.dev/api/unsubscribe' + q, { method: 'POST' })
        .then(function(r){ return r.json().catch(function(){ return {}; }); })
        .then(function(j){ if (j && j.ok) { say('You are unsubscribed', 'We will not send you news or invitation emails from White Horse Clips. Receipts and delivery emails for orders you place are still sent.');
            var b = document.createElement('button'); b.textContent = 'Changed your mind? Subscribe again'; b.style.cssText = 'margin-top:1rem;padding:.7rem 1.2rem;border:0;border-radius:6px;background:#4f46e5;color:#fff;font-size:1rem;cursor:pointer';
            b.onclick = function(){ b.disabled = true; fetch('https://whclips-access-gate.green-mouse-5a6e.workers.dev/api/unsubscribe' + q + '&a=resub', { method: 'POST' }).then(function(r){ return r.json(); }).then(function(k){ if (k && k.ok) { say('You are subscribed again', 'Thank you. You will receive our news and invitation emails again.'); b.remove(); } else { b.disabled = false; b.textContent = 'Could not subscribe - try again'; } }).catch(function(){ b.disabled = false; b.textContent = 'Could not subscribe - try again'; }); };
            p.parentNode.appendChild(b); } else say('This link is not valid', 'Please email info@whclips.co.za and we will remove you by hand.'); })
        .catch(function(){ say('Something went wrong', 'Please try the link again, or email info@whclips.co.za and we will remove you by hand.'); });
      return;
    }
    if (!/[?&]e=/.test(q) || !/[&?]s=/.test(q)) { say('This link is not valid', 'Please email info@whclips.co.za and we will remove you by hand.'); return; }
    location.replace('https://whclips-access-gate.green-mouse-5a6e.workers.dev/api/unsubscribe' + q);
  })();
</script>
</body>
</html>
