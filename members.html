<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Members | White Horse Clips</title>
<link rel="icon" href="favicon.ico">
<style>
  body{ margin:0; background:#000; color:#f5f5f5; font-family:Arial,Helvetica,sans-serif; }
  main{ max-width:26rem; margin:14vh auto; padding:0 1.5rem; }
  h1{ font-size:1.6rem; margin:0 0 .8rem; }
  p{ line-height:1.6; color:#bbb; }
  a{ color:#818cf8; }
  label{ display:block; font-size:.9rem; color:#ddd; margin:1.2rem 0 .4rem; }
  input{ width:100%; box-sizing:border-box; font:inherit; font-size:1rem; padding:.7rem .8rem; border:1px solid #3f3f46; border-radius:6px; background:#111; color:#f5f5f5; }
  input:focus{ outline:2px solid #818cf8; outline-offset:1px; }
  #code{ letter-spacing:.3em; font-size:1.3rem; }
  button{ margin-top:1rem; width:100%; font:inherit; font-weight:700; padding:.75rem; border:0; border-radius:6px; background:#4f46e5; color:#fff; cursor:pointer; }
  button:disabled{ opacity:.6; cursor:default; }
  .msg{ min-height:1.4em; margin-top:1rem; font-size:.95rem; }
  .err{ color:#fca5a5; }
  .small{ font-size:.85rem; color:#888; }
  #view{ position:fixed; inset:0; width:100%; height:100%; border:0; background:#fafaf9; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main id="login" hidden>
  <h1>Members</h1>
  <p>Log in with the email address White Horse Clips has on its members list. We email you a six-digit code; there is no password.</p>
  <form id="f1">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" required>
    <button id="b1" type="submit">Email me a code</button>
  </form>
  <form id="f2" hidden>
    <label for="code">Six-digit code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button id="b2" type="submit">Log in</button>
    <p class="small"><a href="#" id="again">Use a different email or ask for a new code</a></p>
  </form>
  <p class="msg" id="msg" aria-live="polite"></p>
  <p class="small">Not a member? <a href="contact.html">Contact us</a>. <a href="/">Back to whclips.co.za</a></p>
</main>
<iframe id="view" title="Members area" sandbox="allow-scripts" hidden></iframe>
<script>
  // Only this form lives on the public site. The members pages are handed over by the access gate for a valid login and shown in the
  // sealed frame above, so the address bar stays on whclips.co.za. The frame cannot reach this page's storage (no allow-same-origin).
  var W = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8787' : 'https://whclips-access-gate.green-mouse-5a6e.workers.dev';
  var KEY = 'whc_member';
  var $ = function (id) { return document.getElementById(id); };
  function say(t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }
  function post(path, body) {
    return fetch(W + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); });
  }
  function showLogin(note, err) {
    $('view').hidden = true; $('view').srcdoc = ''; $('login').hidden = false; document.title = 'Members | White Horse Clips';
    if (note) say(note, err);
  }
  function page() { return (location.hash || '#home').slice(1) || 'home'; }
  function load() {
    var token = localStorage.getItem(KEY);
    if (!token) { showLogin(); return; }
    if (page() === 'logout') {
      localStorage.removeItem(KEY);
      post('/api/members/logout', { token: token }).catch(function () {});
      history.replaceState(null, '', location.pathname);
      showLogin('You are logged out.');
      return;
    }
    post('/api/members/page', { token: token, page: page() }).then(function (r) {
      if (r.status === 401) { localStorage.removeItem(KEY); showLogin('Your login has expired. Ask for a new code.', true); return; }
      if (!r.ok) { history.replaceState(null, '', location.pathname + '#home'); load(); return; }
      var t = /<title>([^<]*)<\/title>/i.exec(r.j.html);
      document.title = t ? t[1] : 'Members | White Horse Clips';
      $('login').hidden = true; $('view').hidden = false; $('view').srcdoc = r.j.html.replace(/<\/body>/i, LINKS + '</body>');
    }).catch(function () { showLogin('Could not reach the server. Try again.', true); });
  }
  // Links inside the frame (#home, #logout, #<page>) are passed up as a message; this page then changes its own address.
  // The frame can only ask for a page name; anything else is ignored.
  var LINKS = '<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");if(!a)return;e.preventDefault();parent.postMessage({whcGo:a.getAttribute("href").slice(1)},"*");});<\/script>';
  window.addEventListener('message', function (e) {
    if (e.source !== $('view').contentWindow || !e.data || typeof e.data.whcGo !== 'string' || !/^[a-z-]{1,40}$/.test(e.data.whcGo)) return;
    if (location.hash === '#' + e.data.whcGo) load(); else location.hash = e.data.whcGo;
  });
  window.addEventListener('hashchange', load);
  $('f1').addEventListener('submit', function (e) {
    e.preventDefault(); $('b1').disabled = true; say('Sending…');
    post('/api/members/request', { email: $('email').value }).then(function (r) {
      $('b1').disabled = false;
      if (!r.ok) { say(r.j.error || 'Something went wrong. Try again.', true); return; }
      say(r.j.message); $('f1').hidden = true; $('f2').hidden = false; $('code').focus();
    }).catch(function () { $('b1').disabled = false; say('Could not reach the server. Try again.', true); });
  });
  $('f2').addEventListener('submit', function (e) {
    e.preventDefault(); $('b2').disabled = true; say('Checking…');
    post('/api/members/verify', { email: $('email').value, code: $('code').value.trim() }).then(function (r) {
      $('b2').disabled = false;
      if (!r.ok || !r.j.token) { say(r.j.error || 'That code did not work.', true); return; }
      localStorage.setItem(KEY, r.j.token);
      $('f2').hidden = true; $('f1').hidden = false; $('code').value = ''; say('');
      history.replaceState(null, '', location.pathname + '#home'); load();
    }).catch(function () { $('b2').disabled = false; say('Could not reach the server. Try again.', true); });
  });
  $('again').addEventListener('click', function (e) {
    e.preventDefault(); $('f2').hidden = true; $('f1').hidden = false; $('code').value = ''; say(''); $('email').focus();
  });
  load();
</script>
</body>
</html>
