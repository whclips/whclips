<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Members | White Horse Clips</title>
<link rel="icon" href="favicon.ico">
<style>
  body{ margin:0; background:#000; color:#f5f5f5; font-family:Arial,Helvetica,sans-serif; }
  main{ max-width:26rem; margin:14vh auto; padding:0 1.5rem; }
  h1{ font-size:1.6rem; margin:0 0 .8rem; }
  p{ line-height:1.6; color:#bbb; }
  a{ color:#818cf8; }
  label{ display:block; font-size:.9rem; color:#ddd; margin:1.2rem 0 .4rem; }
  input{ width:100%; box-sizing:border-box; font:inherit; font-size:1rem; padding:.7rem .8rem; border:1px solid #3f3f46; border-radius:6px; background:#111; color:#f5f5f5; }
  input:focus{ outline:2px solid #818cf8; outline-offset:1px; }
  #code{ letter-spacing:.3em; font-size:1.3rem; }
  button{ margin-top:1rem; width:100%; font:inherit; font-weight:700; padding:.75rem; border:0; border-radius:6px; background:#4f46e5; color:#fff; cursor:pointer; }
  button:disabled{ opacity:.6; cursor:default; }
  .msg{ min-height:1.4em; margin-top:1rem; font-size:.95rem; }
  .err{ color:#fca5a5; }
  .small{ font-size:.85rem; color:#888; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Members</h1>
  <p id="intro">Log in with the email address White Horse Clips has on its members list. We email you a six-digit code; there is no password.</p>
  <form id="f1">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" required>
    <button id="b1" type="submit">Email me a code</button>
  </form>
  <form id="f2" hidden>
    <label for="code">Six-digit code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button id="b2" type="submit">Log in</button>
    <p class="small"><a href="#" id="again">Use a different email or ask for a new code</a></p>
  </form>
  <p class="msg" id="msg" aria-live="polite"></p>
  <p class="small">Not a member? <a href="contact.html">Contact us</a>. <a href="/">Back to whclips.co.za</a></p>
</main>
<script>
  // The members pages are served by the access gate, not by this public site: only this form lives here.
  var W = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:8787' : 'https://whclips-access-gate.green-mouse-5a6e.workers.dev';
  var $ = function (id) { return document.getElementById(id); };
  function say(t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }
  var q = new URLSearchParams(location.search);
  if (q.get('out')) say('You are logged out.');
  if (q.get('expired')) say('That login link expired. Ask for a new code.', true);
  function post(path, body) {
    return fetch(W + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }
  $('f1').addEventListener('submit', function (e) {
    e.preventDefault(); $('b1').disabled = true; say('Sending…');
    post('/api/members/request', { email: $('email').value }).then(function (r) {
      $('b1').disabled = false;
      if (!r.ok) { say(r.j.error || 'Something went wrong. Try again.', true); return; }
      say(r.j.message); $('f1').hidden = true; $('f2').hidden = false; $('code').focus();
    }).catch(function () { $('b1').disabled = false; say('Could not reach the server. Try again.', true); });
  });
  $('f2').addEventListener('submit', function (e) {
    e.preventDefault(); $('b2').disabled = true; say('Checking…');
    post('/api/members/verify', { email: $('email').value, code: $('code').value.trim() }).then(function (r) {
      if (!r.ok || !r.j.enter) { $('b2').disabled = false; say(r.j.error || 'That code did not work.', true); return; }
      say('Logging you in…'); location.href = W + r.j.enter;
    }).catch(function () { $('b2').disabled = false; say('Could not reach the server. Try again.', true); });
  });
  $('again').addEventListener('click', function (e) {
    e.preventDefault(); $('f2').hidden = true; $('f1').hidden = false; $('code').value = ''; say(''); $('email').focus();
  });
</script>
</body>
</html>
